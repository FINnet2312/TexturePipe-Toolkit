[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "texpipe"
version = "1.0.0"
description = "Desktop texture channel editing and conversion tool"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "Pillow>=10.0",
    "PySide6>=6.5",
    "pypng>=0.20220715.0",
    "tifffile>=2024.8",
    "OpenEXR>=3.3",
]

[project.gui-scripts]
texpipe = "src.ui.main:main"

[project.optional-dependencies]
build = [
    "PyInstaller>=6.21,<7",
]
[tool.setuptools.packages.find]
include = ["src", "src.*"]
