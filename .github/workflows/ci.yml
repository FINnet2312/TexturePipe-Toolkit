# CI — 持续集成
# 每次 push / PR 到 main 时,在干净的 Windows 环境里:
#   1. 安装依赖
#   2. 跑全部单元测试(unittest, headless offscreen Qt)
#   3. 跑 Skybox 冒烟测试
# 任何一步失败,GitHub 会在 commit / PR 上标红,阻止带病代码合入。

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    env:
      # CI 控制台是 cp1252,强制 UTF-8 防止中文输出触发 UnicodeEncodeError
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Per-file test run (diagnostic)
        shell: cmd
        run: |
          rem 用 discover -p 逐文件在独立进程运行(与完整运行相同的导入语义)
          rem -X faulthandler: 原生崩溃时把 Python 栈直接写到控制台
          for %%f in (tests\test_*.py) do (
            echo === %%~nxf ===
            python -X faulthandler -m unittest discover -s tests -p %%~nxf -v
          )
          exit /b 0

      - name: Run unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        shell: cmd
        run: |
          python -X faulthandler -m unittest discover -s tests -q 1> unittest_out.txt 2> unittest_err.txt
          set CODE=%ERRORLEVEL%
          echo --- STDOUT ---
          type unittest_out.txt
          echo --- STDERR ---
          type unittest_err.txt
          exit /b %CODE%

      - name: Skybox smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python examples/verify_skybox_smoke.py
