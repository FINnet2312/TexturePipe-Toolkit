# CI — 持续集成
# 每次 push / PR 到 main 时,在干净的 Windows 环境里:
#   1. 安装依赖
#   2. 跑全部单元测试(unittest, headless offscreen Qt)
#   3. 跑 Skybox 冒烟测试
# 任何一步失败,GitHub 会在 commit / PR 上标红,阻止带病代码合入。

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: windows-2022
    env:
      # CI 控制台是 cp1252,强制 UTF-8 防止中文输出触发 UnicodeEncodeError
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        shell: cmd
        run: |
          rem 每个测试文件在独立进程中运行:
          rem 1) Qt 原生状态在跨文件共享时曾在 CI 上引发堆损坏(0xC0000374),
          rem    进程隔离可彻底避免跨文件污染
          rem 2) 任何崩溃都能精确定位到具体文件
          rem -X faulthandler: 原生崩溃时把 Python 栈直接打印到控制台
          set FAIL=0
          for %%f in (tests\test_*.py) do (
            echo === %%~nxf ===
            python -X faulthandler -m unittest discover -s tests -p %%~nxf -q || set FAIL=1
          )
          exit /b %FAIL%

      - name: Skybox smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python examples/verify_skybox_smoke.py
